{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicdesk.fullname" . }}-grafana-dashboard
  labels:
    {{- include "clinicdesk.labels" . | nindent 4 }}
    # Picked up by the Grafana dashboard sidecar in kube-prometheus-stack.
    grafana_dashboard: "1"
data:
  clinicdesk.json: |-
{{ .Files.Get "dashboards/clinicdesk.json" | replace "__NAMESPACE__" .Release.Namespace | indent 4 }}
{{- end }}
