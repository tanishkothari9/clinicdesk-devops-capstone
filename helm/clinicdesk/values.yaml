# Default values for the ClinicDesk chart.
# Image tags are the Git commit SHA produced by CI; override with --set *.image.tag=<sha>.

imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/tanishkothari9/clinicdesk-backend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  clinicTimezone: Asia/Kolkata
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

frontend:
  image:
    repository: ghcr.io/tanishkothari9/clinicdesk-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

postgres:
  image: postgres:16-alpine
  database: clinicdesk
  username: clinicdesk
  # Leave empty to generate a random password once and keep it across upgrades.
  password: ""
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ingress:
  enabled: false
  className: nginx
  host: clinicdesk.local
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    # kube-prometheus-stack selects ServiceMonitors carrying its release label.
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    enabled: false
