name: ClinicDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest (quality gate)
        working-directory: backend
        run: pytest -v --junitxml=pytest-report.xml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-scan-push:
    name: Build, scan & push (${{ matrix.component }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        # GHCR image names must be lowercase; repository_owner may not be.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${owner}/clinicdesk-${{ matrix.component }}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image (tagged with commit SHA)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "$IMAGE"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy with Helm
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - name: Check cluster credentials
        id: cluster
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::notice title=Deploy skipped::KUBE_CONFIG_DATA secret is not set, so there is no cluster to deploy to. Images for ${GITHUB_SHA} are in GHCR; deploy them with scripts/deploy.sh."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cluster.outputs.configured == 'true'

      - uses: azure/setup-helm@v5
        if: steps.cluster.outputs.configured == 'true'

      - name: Configure kubectl
        if: steps.cluster.outputs.configured == 'true'
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: helm upgrade --install
        if: steps.cluster.outputs.configured == 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install clinicdesk ./helm/clinicdesk \
            --namespace clinicdesk --create-namespace \
            -f helm/clinicdesk/values-prod.yaml \
            --set backend.image.repository=ghcr.io/${owner}/clinicdesk-backend \
            --set frontend.image.repository=ghcr.io/${owner}/clinicdesk-frontend \
            --set backend.image.tag=${GITHUB_SHA} \
            --set frontend.image.tag=${GITHUB_SHA} \
            --wait --timeout 5m
          kubectl get pods -n clinicdesk
